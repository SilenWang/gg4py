[snapshots."guides/stylised-guide-custom.svg"]
reason = "空图（没有图层）的版面口径未复刻：R 的 `ggplot()` 没有轴占位，面板直接铺满 plot.margin 内区；我们仍按轴 / 标题占位，面板左边界差 22pt（图级 10.4%）。要先改「无图层 → 无轴占位」这条版式规则。"

[snapshots."guide-legend/enlarged-guides.svg"]
reason = "key 尺寸没跟着 `size` / `linewidth` 标度走：R 的 `draw_key` 会把 key 的宽高报回 gtable（17.28pt → 34.02pt），我们固定用 `legend.key.size`（图级 8.1%）。卡在「复数 size 撑开 key 格」这条测量链。"

[snapshots."guide-legend/legend-key-justification.svg"]
reason = "同上（key 格要按 `size` 标度撑开）+ 多行标签下 `legend.key.justification` 的对齐（图级 10.5%）。"

[snapshots."draw-key/appropriate-colour-key-with-alpha-key-as-lines.svg"]
reason = "依赖 `geom_point(show.legend = c(colour = NA, alpha = FALSE))` 这种逐美学 show.legend 写法，本仓的 `show_legend` 只有布尔。"

[snapshots."draw-key/circle-glyphs-of-2cm-size.svg"]
reason = "依赖 `key_glyph` 自定义函数 + grob 上的 `width` / `height` 属性（2cm key 撑开图例）；本仓还没有 `key_glyph` 覆盖点。"

[snapshots."draw-key/rectangle-and-dotplot-key-glyphs.svg"]
reason = "依赖 `key_glyph = draw_key_rect` / `draw_key_dotplot`；本仓的图例 key 只走 `Geom.draw()`，没有 `key_glyph`。"

[snapshots."draw-key/time-series-and-polygon-key-glyphs.svg"]
reason = "依赖 `key_glyph = 'timeseries'` / 'polygon'`；同上。"

[snapshots."legend-draw/all-legend-keys.svg"]
reason = "这条快照不是 ggplot 对象，而是把 17 个 `draw_key_*` 直接拼成 gtable 后画；三文件 case 只接 plot 规格，得先有 `key_glyph` 才能用图例复现同一组 key。"
