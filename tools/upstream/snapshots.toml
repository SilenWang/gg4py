# 上游 v4.0.3 的 311 份 SVG 快照逐条处置（SIL-745）。
#
# - `[snapshots."<path>"] case = "<slug>"`：已复刻成三文件 case，expected.svg 与
#   上游快照逐字节相同（`pixi run snapshots:check` 校验 sha256）。
# - 其余按 `[groups."<第一段目录名>"]` 归口：`issue` + 原因。原因写的是**这一类**
#   缺什么能力，不是「还没做」；换 pin 或补上能力时改这里，不要改生成物。
#
# 缺口池统一是 SIL-715（M2 缺口池），M3 的空间 / 交互能力在原因里点名。
#
# `owner` 两档（SIL-786）：
#   m2-closeout — 「M2 已宣称但没做到对等」的缺口，必须在 M3 开工前清零；
#   m3          — 真 M3 新能力（geom_sf / coord_sf / coord_map / annotate / 版面组合），
#                 移交 M3 但不许无主留在台账里。
# 单条 `[snapshots."..."]` 未写 owner 时继承所属簇的 owner。

[groups.aes]
