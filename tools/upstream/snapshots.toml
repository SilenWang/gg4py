owner = "m2-closeout"
reason = "SIL-795 已全部纳管 6 条：`geom_bar(stat=\"identity\"|\"count\", width=)` 的柱宽语义与 `I()` 恒等色 / 透明度。其中 `col <- runif`、`stat_count` 的 `prop` 列沿用既有实现。"

