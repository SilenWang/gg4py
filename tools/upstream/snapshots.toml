[snapshots."theme/legends-at-all-sides-with-justification.svg"]
reason = "需要 `mtcars` 完整夹具（`hp` / `gear` / `wt` 三列本仓还没有内联），且用 `legend.location = 'plot'` 把图例挂在整页而不是面板行；`legend.justification.<side>` 已实现。"

[snapshots."theme/stretched-vertical-legends.svg"]
reason = "`legend.key.height = unit(1, 'null')` 是 stretchy key：R 让 key 吃掉 guide-box 的剩余高度，本仓的 `_key_size()` 把 `null` 换算成 0 后直接报错。归口 G1 的 stretchy 版式（SIL-715）。"

[snapshots."theme/stretched-horizontal-legends.svg"]
reason = "同 `stretched-vertical-legends`：`legend.key.width` 的 `null` 单位未实现。"

[snapshots."theme/vertical-legends-placed-apart.svg"]
reason = "`legend.spacing.y = unit(1, 'null')` 要在 guide-box 内分配剩余高度；本仓的 `legend_box_layout()` 只按固定 cm 累加（横向的 `spacing.x` 版`horizontal-legends-placed-apart` 已纳管）。"

[snapshots."theme/custom-strip-elements-can-render.svg"]
reason = "上游用 `S7::new_class()` 造 `element_text` 子类并覆写 `element_grob()` 画 1cm 方块；Python 侧没有可子类化的 element 渲染协议，属扩展能力。"

[snapshots."theme/point-elements.svg"]
reason = "`element_point()` 的 `element_grob()` 渲染（`pch = 21` + 逐点 fill），是 `grid.newpage()` + `grid.draw()` 的裸 grob 快照，不走 ggplot 管线。"

[snapshots."theme/polygon-elements.svg"]
reason = "`element_polygon()` 的 `element_grob()` 渲染（两段 `id` 的 pathgrob），同 `point-elements`，是裸 grob 快照。"
