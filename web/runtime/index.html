<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gg4py · 浏览器运行时（Pyodide + ggcore）</title>
    <script>
      // SIL-830 · worker 预载：这一段在 **HTML 解析期**就执行，比 `runtime.js` 那个
      // 模块早一个 RTT。warm（回访）时 Service Worker 已经在管页面，worker 立刻起，
      // pyodide 的请求照样被 SW 接管（缓存与字节进度都不丢）；cold 时还没有
      // controller，此刻起 worker 等于绕开 SW，交给 runtime.js 在 `ready` 之后起。
      //
      // 预载的 worker 会先发消息（`stage` / `ready`），而接管它的是后加载的模块：
      // 这里先把消息攒进队列，`__ggWorkerSink(fn)` 被调用时同步回放，然后交棒。
      (function () {
        window.__ggPerf = { start: performance.now() };
        if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
        // SW 的字节进度也可能先于 `runtime.js` 到达（warm 时 cache 命中是瞬时的），
        // 所以监听器在这儿就装好、消息先攒着，模块接管时同步回放——否则 warm 的
        // 进度会永远停在「缺 pyodide.mjs + stdlib」的地方（实测 87%）。
        const vendorQueue = [];
        let vendorSink = null;
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (vendorSink) vendorSink(event.data);
          else vendorQueue.push(event.data);
        });
        window.__ggVendorSink = (fn) => {
          window.__ggVendorSink = fn;
          vendorSink = fn;
          for (const message of vendorQueue.splice(0)) fn(message);
        };
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
        if (!navigator.serviceWorker.controller) return;
        const worker = new Worker("./worker.js", { type: "module" });
        const queue = [];
        let sink = null;
        worker.addEventListener("message", (event) => {
          if (sink) sink(event.data);
          else queue.push(event.data);
        });
        // 预载的 worker 出错时页面还没接管：先记下来，`runtime.js` 接管时补报，
        // 否则 `await ready` 会一直悬着（页面卡在「预热 worker」）。
        worker.addEventListener("error", (event) => {
          window.__ggWorkerEarlyError = String((event && event.message) || "worker error");
        });
        window.__ggWorkerEarly = worker;
        window.__ggWorkerSink = (fn) => {
          window.__ggWorkerSink = fn;
          sink = fn;
          for (const message of queue.splice(0)) fn(message);
        };
        worker.postMessage({ type: "boot" });
        window.__ggPerf.worker_early = performance.now();
      })();
    </script>
    <!-- 受管字体的 @font-face：`pixi run pyodide:assets` 从 viewer 的字族表里裁出
         ≤ 2 MiB 的拉丁字面（CJK 35 MB 不进首屏，见 tools/pyodide/stage_assets.py）。 -->
    <link rel="stylesheet" href="./vendor/fonts.css" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f6f4;
        --ink: #1d1d1b;
        --muted: #666;
        --rule: #d8d8d4;
        --accent: #2b6cb0;
        --ok: #2f855a;
        --bad: #c53030;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.55 -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
      }
      header {
        padding: 12px 20px 14px;
        background: #fff;
        border-bottom: 1px solid var(--rule);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      h1 span {
        color: var(--muted);
        font-weight: 400;
        margin-left: 8px;
      }
      #badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .badge {
        padding: 2px 8px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .badge[data-state="ok"] {
        color: var(--ok);
        border-color: #b8ddc9;
        background: #f0fbf5;
      }
      .badge[data-state="bad"] {
        color: var(--bad);
        border-color: #f0c2c2;
        background: #fdf0f0;
      }
      /* 加载进度：首访必须看得见（SIL-824 的验收项之一）。 */
      .progress {
        position: relative;
        height: 8px;
        margin-top: 10px;
        border-radius: 999px;
        background: #ececea;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4a9bdc, var(--accent));
        transition: width 120ms linear;
      }
      #stage {
        margin-top: 6px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-height: 1.5em;
      }
      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 300px;
        gap: 16px;
        padding: 16px 20px 28px;
        align-items: start;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      nav button {
        text-align: left;
        padding: 8px 10px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      nav button[aria-selected="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      nav button small {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
      }
      #stage-area {
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 12px;
        min-height: 320px;
        overflow: auto;
      }
      #stage-area svg.gg-svg {
        display: block;
        max-width: 100%;
        height: auto;
        background: #fff;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      section.card {
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 10px 12px;
      }
      section.card h2 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      code,
      pre {
        font-family: "DejaVu Sans Mono", ui-monospace, monospace;
        font-size: 11.5px;
      }
      pre#error {
        margin: 8px 0 0;
        padding: 8px;
        max-height: 240px;
        overflow: auto;
        background: #fdf0f0;
        border: 1px solid #f0c2c2;
        border-radius: 8px;
        color: #7b2020;
        white-space: pre-wrap;
      }
      pre#error[hidden] {
        display: none;
      }
      #timeline {
        list-style: none;
        margin: 0;
        padding: 0;
        font-variant-numeric: tabular-nums;
      }
      #timeline li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 1px 0;
        color: var(--muted);
      }
      #timeline li b {
        color: var(--ink);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>gg4py · 浏览器运行时<span>Pyodide 里的整个 ggcore（资产同源，无 CDN）</span></h1>
      <div id="badges">
        <span class="badge" id="badge-state">启动中</span>
        <span class="badge" id="badge-bytes">0 B</span>
        <span class="badge" id="badge-packages">包：无</span>
        <span class="badge" id="badge-cache">缓存：—</span>
      </div>
      <div class="progress" role="progressbar" aria-label="加载进度">
        <div id="bar"></div>
      </div>
      <div id="stage" data-state="loading">准备加载运行时…</div>
    </header>

    <main>
      <nav id="demos" aria-label="示例"></nav>

      <div id="stage-area">
        <p id="placeholder" style="color: #666">运行时启动后，选一个示例出图。</p>
      </div>

      <aside>
        <section class="card">
          <h2>这次出图</h2>
          <dl id="result">
            <dt>状态</dt><dd>等待启动</dd>
          </dl>
        </section>
        <section class="card">
          <h2>运行时</h2>
          <dl id="runtime-info">
            <dt>pyodide</dt><dd>—</dd>
          </dl>
        </section>
        <section class="card">
          <h2>阶段耗时</h2>
          <ul id="timeline"></ul>
        </section>
      </aside>
    </main>

    <pre id="error" hidden></pre>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
