# .github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: default
          cache: true
      - name: pixi run check
        run: pixi run check

  prod-env:
    name: prod env stays clean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: prod
          cache: true
      # prod 只留运行期依赖：测试与 lint 工具泄漏进来会让“浏览器/服务端只装运行期”
      # 这条前提悄悄失效。
      - name: pytest and ruff are absent
        run: |
          if pixi run -e prod pytest --version; then
            echo "::error::pytest leaked into the prod environment"; exit 1
          fi
          if pixi run -e prod ruff --version; then
            echo "::error::ruff leaked into the prod environment"; exit 1
          fi
      - name: runtime imports work
        run: PYTHONPATH=src pixi run -e prod python -c "import ggcore, numpy, skia; print('ggcore', ggcore.__version__)"