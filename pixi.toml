[workspace]
channels = ["conda-forge"]
name = "gg4py"
platforms = ["linux-64"]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Environment composition (see README "任务与环境")
#
#   default / dev : runtime deps + pytest / ruff / playwright (this is the env
#                   `pixi run check` resolves against)
#   prod          : runtime deps only — no pytest, no ruff, no playwright
#
# Both solve in the same solve-group so a lock has one version of numpy/skia
# across environments; only the package *set* differs.
# ---------------------------------------------------------------------------
[environments]
default = { features = ["dev"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
# Reference values generated by the real R: its own solve group so the R
# toolchain never leaks into dev/prod (see "参考值" in docs/notes/units.md).
refs = { features = ["refs"], solve-group = "refs" }

[dependencies]
python = "3.12.*"
nodejs = "22.*"
font-ttf-dejavu = ">=2.37,<3"
font-ttf-noto = ">=20201206,<20201207"
font-ttf-noto-cjk = ">=2.4,<3"
font-ttf-noto-emoji = ">=2.34,<3"
libegl = ">=1.7.0,<2"
libglvnd = ">=1.7.0,<2"
libopengl = ">=1.7.0,<2"
libglx = ">=1.7.0,<2"
libgl = ">=1.7.0,<2"
fontconfig = ">=2.18.3,<3"
glib = ">=2.90.0,<3"
nss = ">=3.118,<4"
nspr = ">=4.40,<5"
"atk-1.0" = ">=2.38.0,<3"
at-spi2-core = ">=2.58.3,<3"
libxkbcommon = ">=1.13.2,<2"
alsa-lib = ">=1.2.16.1,<2"
libgbm = ">=1.0.9,<2"
xorg-libxcomposite = ">=0.4.7,<0.5"
xorg-libxdamage = ">=1.1.6,<2"
xorg-libxfixes = ">=6.0.2,<7"
xorg-libxrandr = ">=1.5.5,<2"
# M0-9 的统一栅格：SVG → PNG 只走一个实现（resvg），参考图（R svglite 产出）
# 与实测图（我们的 SVG 设备产出）用同一个光栅器，文字/抗锯齿才不会各说各话。
resvg = ">=0.47,<0.48"

[pypi-dependencies]
uharfbuzz = ">=0.57.0, <0.58"
numpy = ">=2.5.4, <3"
skia-python = ">=144.1, <145"
cbor2 = ">=6.1.5, <7"
# `pixi run diff` 的位图读写（PNG 解码 / 差异热图编码），不依赖绘图库。
pillow = ">=11, <14"

# `src/` layout without a build backend: the package is imported through
# PYTHONPATH (pytest.ini carries the same path for the test runner).
[tasks]
render = "PYTHONPATH=src python -m ggskia.cli.render"
diff = "PYTHONPATH=src python -m ggdiff.cli"
# M1-12：一张 ggplot → PNG / SVG / PDF，或 IR（.ggir.cbor / .ir.json）。
# 形状：`pixi run ggsave <module:plot_fn> <out.png|.svg|.pdf|.cbor|.json>`。
# 入口在 ggskia（出图要 skia-python，X1 门禁不允许 ggcore import 它；
# 设备无关的编排在 ggcore.io，见 docs/notes/io.md）。
ggsave = "PYTHONPATH=src python -m ggskia.cli.ggsave"
# 诊断：10k 点 path 的 IR 体积 vs 逐元素 JSON（docs/notes/ir.md 的数字来源）。
"ir:size" = "PYTHONPATH=src python tools/ir_size_report.py"
# M1-13：浏览器查看器（IR → DOM SVG，零 wasm）。tsc 从 npm 装到 node_modules
# （不入库），产物落 web/viewer/dist（不入库）；`pixi run viewer:sample` 生成
# 手测 / 截图用的 2×2 分面 + 图例场景。测试要真 Chromium，`viewer:browsers`
# 把浏览器装进仓库（$HOME 只读，同 spike:e1）。
"viewer:build" = "PYTHONPATH=src python tools/viewer/emit_fonts.py && npm install --no-save --no-package-lock typescript && npx tsc -p web/viewer"
"viewer:browsers" = "PLAYWRIGHT_BROWSERS_PATH=$PWD/.playwright-browsers playwright install chromium"
"viewer:sample" = "PYTHONPATH=src python tools/viewer/export_scene.py"
"viewer:shot" = "PYTHONPATH=src python tools/viewer/screenshot.py"
# M1-16：逐条 case → IR → 浏览器查看器 → 取回 DOM SVG → 与 expected.svg
# 一起走 resvg 像素对拍，并生成 dist/gallery.html。CI 用 `viewer:cases:ci`
# 跑 12 条代表性子集（挂进 `pixi run check`，避免每个 PR 全量 61 条）。
"viewer:cases" = "PYTHONPATH=src python tools/viewer/cases.py"
"viewer:cases:ci" = { cmd = "PYTHONPATH=src python tools/viewer/cases.py --sample 12 --min-pass 12", depends-on = ["viewer:build", "viewer:browsers"] }
# viewport 可视化快照（M0-4）：三层嵌套旋转 + 裁剪三态，产物进 docs/cases/*/baseline。
# `--check` 只比对不写文件；渲染用 pixi 受管的 skia 与字体。
"cases:viewport" = "PYTHONPATH=src python tools/cases/viewport_cases.py"
# grob 可视化快照（M0-6）：每种原语一张，走 grob → 场景遍历 → 临时 skia 设备。
"cases:grob" = "PYTHONPATH=src python tools/cases/grob_cases.py"
# M0-11: 案例库覆盖矩阵 + CI 报告。扫 docs/cases 的三文件 case，渲染/比对走
# render / diff 两个任务名；静态矩阵 docs/cases/matrix.md 入库，`--check` 守新鲜度。
"cases:matrix" = "PYTHONPATH=src python tools/cases/matrix.py"
# 静态校验（不渲染）：契约错 → 非 0；矩阵过期 → 非 0。挂进 `check`，所以普通
# CI job 就能守住「新增 case 必须重生成矩阵」。真渲染/比对仍走 `cases:matrix`。
"cases:matrix:check" = "PYTHONPATH=src python tools/cases/matrix.py --check --no-run"
# 设备三路冒烟（M0-8）：一张手搓图 → PNG / SVG / PDF，产物进 docs/cases/device-smoke/current。
"cases:device" = "PYTHONPATH=src python tools/cases/device_cases.py"
# M1-5 等比例验证：2×2 合成 panel → PNG / SVG，量面板像素宽高比
# （ratio=1 / ratio=2 / 不写 coord_fixed 的对照）。产物进 .coord-aspect/（不入库）。
"cases:coord" = "PYTHONPATH=src python tools/cases/coord_aspect_cases.py"
# X2: weekly diff of upstream R/ against the pinned ggplot2 commit.
"upstream:diff" = "python tools/upstream_diff.py"

# M-1 feasibility gate (docs/spike). Every spike step is reproducible via pixi.
"spike:corpus" = "python docs/spike/corpus/generate_corpus.py"
# CanvasKit (the browser-side text engine) is fetched by npm, not pip: it is the
# wasm build the viewer actually runs. Shared by the E2 spike and gate:metrics.
"assets:canvaskit" = "npm install --no-save --no-package-lock canvaskit-wasm@0.42.0"
"spike:assets" = { cmd = "echo canvaskit-wasm ready", depends-on = ["assets:canvaskit"] }
"spike:e2" = { cmd = "python docs/spike/e2_metrics/run_e2.py", depends-on = ["spike:assets"] }
"spike:e3" = { cmd = "python docs/spike/e3_export/run_e3.py", depends-on = ["spike:assets"] }
# E1: Pyodide cold start behind a worker, measured under CDP throttling.
# Browsers live in the checkout because $HOME is read-only in the runtime;
# if cdn.playwright.dev is unreachable, point PLAYWRIGHT_DOWNLOAD_HOST at a
# mirror (e.g. https://cdn.npmmirror.com/binaries/playwright) for the install.
"spike:e1:browsers" = "PLAYWRIGHT_BROWSERS_PATH=$PWD/.playwright-browsers playwright install chromium"
"spike:e1:assets" = "npm install --no-save --no-package-lock --prefix docs/spike/e1_coldstart/.npm pyodide@314.0.7 && python docs/spike/e1_coldstart/fetch_assets.py"
"spike:e1" = { cmd = "python -u docs/spike/e1_coldstart/run_e1.py", depends-on = ["spike:e1:assets"] }

[feature.dev.pypi-dependencies]
pytest = ">=9.2.0, <10"
pytest-benchmark = ">=5.2.0, <6"
ruff = ">=0.17.3, <0.18"
playwright = ">=1.64.1, <2"
pandas = ">=3.1.0, <4"
pyarrow = ">=26.0.0, <27"

# R reference values for R-parity modules (units first). `grid` ships inside
# r-base, so no extra package is needed for `grid::unit`.
[feature.refs.dependencies]
"r-base" = "4.5.*"
r-gtable = "0.3.*"
# M0-9 参考图产线：钉死 ggplot2 4.0.3（与 docs/notes/upstream.md 的 pin 同一版本），
# 用 svglite 出 SVG。这一组只活在 refs 环境里，dev/prod 不会带上 R。
r-ggplot2 = "==4.0.3"
r-svglite = ">=2.2,<3"
r-hms = ">=1.1,<2"
# `geom_hex` / `stat_bin_hex` 的参考产线需要 hexbin（GeomHex 的六边形顶点来自
# `hexbin::hexcoords()`）；只进 refs 环境。
r-hexbin = ">=1.28,<2"

[feature.refs.tasks]
"refs:units" = "Rscript tools/refs/units_ref.R"
# gtable 的行列尺寸由 grid 的 calcViewportLayout() 分配，参考值靠设备测量
# （draw + 视口读回），口径见 docs/notes/gtable.md。
"refs:gtable" = "Rscript tools/refs/gtable_ref.R"
# viewport（M0-4）的对拍夹具：push/pop/down 栈 + 变换 + 裁剪 + gpar 继承
"refs:viewport" = "Rscript tools/refs/viewport_ref.R"
# 设备侧曲线求值（M0-8）：xspline / grid::curve 的采样点对拍
"refs:device" = "Rscript tools/refs/device_ref.R"
# 设备级渲染对拍（SIL-636）：同一页面上 R 真画一遍，PNG 比墨迹、折线比设备坐标
"refs:device-render" = "Rscript tools/refs/device_render_ref.R"
# 参考图产线：ggplot2 4.0.3 + svglite 出 docs/cases/<case>/expected.svg。
# 两个脚本分工：`cases_ref.R` 是 M0-9 的 plot 规格适配层（7 张），
# `cases_battery_ref.R` 是 M1-15 的语法层首批 40 张（与各 case 的 plot.py 一一对应）。
# 只在换 pin 或有意改口径时重跑；产物入库，CI 不装 R。
"refs:cases" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/cases_ref.R && LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/cases_battery_ref.R && LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/coord_cases_ref.R"
# 文字度量对拍夹具（M1 文字测量）：逐行 stringWidth / stringHeight / 行距。
"refs:text" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/text_ref.R"
# M1-3 图层流水线夹具：16+ 张图的内置数据（列名 / 列序 / 类型 / 逐行值）。
# 只在换 pin 或有意改口径时重跑；产物入库，CI 不装 R。
"refs:build" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/build_ref.R"
# theme 元素解析（M1-10）：四套完整主题（grey / bw / minimal / void）逐元素
# calc_element() 的结果。
"refs:theme" = "Rscript tools/refs/theme_ref.R"
# 坐标面板参数（M1-5）：10 个 case 的 x.range / y.range / limits / aspect()
# 与 R 自己报的 "Removed N rows" 计数（含 log10 标度上 coord limits 的变换）。
"refs:coord" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/coord_ref.R"
# 标度（M1-4 / M2-4）：limits / expand / breaks / labels / map（54 个 case）。
# 第二个脚本生成色板取值表 `src/ggcore/palette_data.py`（brewer 逐 n 表 + viridis
# 8 档映射）与色板夹具 `tests/fixtures/palettes_r_reference.json`。
"refs:scales" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/scales_ref.R && LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/palettes_ref.R"
# 分面（M1-6）：layout 的 PANEL/ROW/COL、free scales 的逐面板范围、
# ggplotGrob() 的 panel 宽高与 strip 位置。
"refs:facet" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/facet_ref.R"
# 位置调整（M1-9）：position 的输入（geom setup_data 之后）与输出逐行值，
# stack / fill / dodge / dodge2 / 横向 / jitter / nudge 共 11 个 case。
"refs:position" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/position_ref.R"
# geom 绘制（M1-7）：9 个 geom 的 ggplot_build(p)$data[[1]] 逐列值 + panel ranges +
# handle_na 警告，以及 9 个 theme_void 用例的 expected.svg（ggplot2 4.0.3 + svglite）。
"refs:geom" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/geom_ref.R"
# guide / 主轴（M1-11）：8 个 case 的断点 / 标签 / 图例键（get_guide_data）+
# ggplotGrob() 的 axis / ylab / xlab / title / guide-box 行列尺寸（cm）。
"refs:guide" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/guide_ref.R"
# stat（M1-8）：bin / count / boxplot / smooth(loess) / align 共 30 个 case 的
# ggplot_build(p)$data[[1]] 逐列值 + build/draw 两段 warning。
# loess 覆盖两种面：显式 case 用 surface = "direct" + statistics/trace.hat = "exact"
# （gg4py 的 direct 实现口径）；smooth_default / smooth_horizontal_fullrange 走
# R 的默认口径（surface = "interpolate"，见 docs/notes/stat.md）。
"refs:stat" = "LC_ALL=C.UTF-8 LANG=C.UTF-8 Rscript tools/refs/stat_ref.R"

[feature.dev.tasks]
test = "pytest -q"
lint = "ruff check . && ruff format --check ."
# Benchmark baseline: `pytest benchmarks` with pytest-benchmark autosave.
bench = "pytest benchmarks -q --benchmark-autosave"

# --- 横切门禁 (X1) ---------------------------------------------------------
# Every gate is a plain script with a non-zero exit code, so it runs both from
# `pixi run check` and standalone. See docs/notes/gates.md.
"gate:imports" = "python tools/gates/check_import_whitelist.py"
"gate:ir-json" = "python tools/gates/check_ir_json.py"
"gate:determinism" = "python tools/gates/check_determinism.py"
# M0-10: 同一份 plot → IR 在 CPython（cbor2）与 Pyodide（ggcore 自带纯 Python
# 编码器）上各跑一次，逐字节比较。只要 node，不需要浏览器；资产复用 E1 的
# `spike:e1:assets`（pyodide 运行时 + numpy 轮子，均来自本地目录）。
"gate:pyodide" = { cmd = "python tools/gates/check_pyodide_ir.py", depends-on = ["spike:e1:assets"] }
# 负向对照：让 Pyodide 侧故意差 1 个比特，门禁必须判红才说明它真的在看字节。
"gate:pyodide:selftest" = { cmd = "python tools/gates/check_pyodide_ir.py --expect-diff", depends-on = ["spike:e1:assets"] }
# `_cbor` 与 cbor2 的 canonical 等价性（SIL-646）：9330 个取值，含 NaN 全部位型、
# ±Inf、负数分支、23/24/255/256/65535/65536 长度头、嵌套容器与随机模糊。
# 两类按设计不写的取值（bignum tag、memoryview）断言「必须抛 CBORError」。
"gate:cbor" = "PYTHONPATH=src python tools/gates/check_cbor_diff.py"
# X5: uharfbuzz × CanvasKit advance parity on the frozen 200-label corpus, plus
# skia-python per-glyph parity and the offline fallback table (M0-7).
"gate:metrics" = { cmd = "python tools/gates/check_metrics.py", depends-on = ["assets:canvaskit"] }

# --- 度量表 (M0-7) --------------------------------------------------------
# 兜底表由同一脚本从受管字体生成；`--check` 重新生成并比对，CI 里由 gate:metrics 调用。
"metrics:table" = "python tools/metrics/build_table.py"
"metrics:check-table" = "python tools/metrics/build_table.py --check"
# M1-kerning：现有 case 的 hinted vs linear/HarfBuzz 推进差（写 metrics-ledger）。
"metrics:advance" = "PYTHONPATH=src python tools/metrics/text_advance_report.py"

check = { depends-on = [
  "viewer:build",
  "viewer:browsers",
  "viewer:cases:ci",
  "lint",
  "test",
  "gate:imports",
  "gate:ir-json",
  "gate:determinism",
  "gate:metrics",
  "gate:pyodide",
  "gate:pyodide:selftest",
  "gate:cbor",
  "cases:matrix:check",
] }
