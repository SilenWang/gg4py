[workspace]
channels = ["conda-forge"]
name = "gg4py"
platforms = ["linux-64"]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Environment composition (see README "任务与环境")
#
#   default / dev : runtime deps + pytest / ruff / playwright (this is the env
#                   `pixi run check` resolves against)
#   prod          : runtime deps only — no pytest, no ruff, no playwright
#
# Both solve in the same solve-group so a lock has one version of numpy/skia
# across environments; only the package *set* differs.
# ---------------------------------------------------------------------------
[environments]
default = { features = ["dev"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
# Reference values generated by the real R: its own solve group so the R
# toolchain never leaks into dev/prod (see "参考值" in docs/notes/units.md).
refs = { features = ["refs"], solve-group = "refs" }

[dependencies]
python = "3.12.*"
nodejs = "22.*"
font-ttf-dejavu = ">=2.37,<3"
font-ttf-noto = ">=20201206,<20201207"
font-ttf-noto-cjk = ">=2.4,<3"
font-ttf-noto-emoji = ">=2.34,<3"
libegl = ">=1.7.0,<2"
libglvnd = ">=1.7.0,<2"
libopengl = ">=1.7.0,<2"
libglx = ">=1.7.0,<2"
libgl = ">=1.7.0,<2"
fontconfig = ">=2.18.3,<3"
glib = ">=2.90.0,<3"
nss = ">=3.118,<4"
nspr = ">=4.40,<5"
"atk-1.0" = ">=2.38.0,<3"
at-spi2-core = ">=2.58.3,<3"
libxkbcommon = ">=1.13.2,<2"
alsa-lib = ">=1.2.16.1,<2"
libgbm = ">=1.0.9,<2"
xorg-libxcomposite = ">=0.4.7,<0.5"
xorg-libxdamage = ">=1.1.6,<2"
xorg-libxfixes = ">=6.0.2,<7"
xorg-libxrandr = ">=1.5.5,<2"

[pypi-dependencies]
uharfbuzz = ">=0.57.0, <0.58"
numpy = ">=2.5.4, <3"
skia-python = ">=144.1, <145"
cbor2 = ">=6.1.5, <7"

# `src/` layout without a build backend: the package is imported through
# PYTHONPATH (pytest.ini carries the same path for the test runner).
[tasks]
render = "PYTHONPATH=src python -m ggcore.cli.render"
diff = "PYTHONPATH=src python -m ggcore.cli.diff"
# 诊断：10k 点 path 的 IR 体积 vs 逐元素 JSON（docs/notes/ir.md 的数字来源）。
"ir:size" = "PYTHONPATH=src python tools/ir_size_report.py"
# X2: weekly diff of upstream R/ against the pinned ggplot2 commit.
"upstream:diff" = "python tools/upstream_diff.py"

# M-1 feasibility gate (docs/spike). Every spike step is reproducible via pixi.
"spike:corpus" = "python docs/spike/corpus/generate_corpus.py"
# CanvasKit (the browser-side text engine) is fetched by npm, not pip: it is the
# wasm build the viewer actually runs. Shared by the E2 spike and gate:metrics.
"assets:canvaskit" = "npm install --no-save --no-package-lock canvaskit-wasm@0.42.0"
"spike:assets" = { cmd = "echo canvaskit-wasm ready", depends-on = ["assets:canvaskit"] }
"spike:e2" = { cmd = "python docs/spike/e2_metrics/run_e2.py", depends-on = ["spike:assets"] }
"spike:e3" = { cmd = "python docs/spike/e3_export/run_e3.py", depends-on = ["spike:assets"] }
# E1: Pyodide cold start behind a worker, measured under CDP throttling.
# Browsers live in the checkout because $HOME is read-only in the runtime;
# if cdn.playwright.dev is unreachable, point PLAYWRIGHT_DOWNLOAD_HOST at a
# mirror (e.g. https://cdn.npmmirror.com/binaries/playwright) for the install.
"spike:e1:browsers" = "PLAYWRIGHT_BROWSERS_PATH=$PWD/.playwright-browsers playwright install chromium"
"spike:e1:assets" = "npm install --no-save --no-package-lock --prefix docs/spike/e1_coldstart/.npm pyodide@314.0.7 && python docs/spike/e1_coldstart/fetch_assets.py"
"spike:e1" = { cmd = "python -u docs/spike/e1_coldstart/run_e1.py", depends-on = ["spike:e1:assets"] }

[feature.dev.pypi-dependencies]
pytest = ">=9.2.0, <10"
pytest-benchmark = ">=5.2.0, <6"
ruff = ">=0.17.3, <0.18"
playwright = ">=1.64.1, <2"

# R reference values for R-parity modules (units first). `grid` ships inside
# r-base, so no extra package is needed for `grid::unit`.
[feature.refs.dependencies]
"r-base" = "4.5.*"
r-gtable = "0.3.*"

[feature.refs.tasks]
"refs:units" = "Rscript tools/refs/units_ref.R"
# gtable 的行列尺寸由 grid 的 calcViewportLayout() 分配，参考值靠设备测量
# （draw + 视口读回），口径见 docs/notes/gtable.md。
"refs:gtable" = "Rscript tools/refs/gtable_ref.R"

[feature.dev.tasks]
test = "pytest -q"
lint = "ruff check . && ruff format --check ."
# Benchmark baseline: `pytest benchmarks` with pytest-benchmark autosave.
bench = "pytest benchmarks -q --benchmark-autosave"

# --- 横切门禁 (X1) ---------------------------------------------------------
# Every gate is a plain script with a non-zero exit code, so it runs both from
# `pixi run check` and standalone. See docs/notes/gates.md.
"gate:imports" = "python tools/gates/check_import_whitelist.py"
"gate:ir-json" = "python tools/gates/check_ir_json.py"
"gate:determinism" = "python tools/gates/check_determinism.py"
# X5: uharfbuzz × CanvasKit advance parity on the frozen 200-label corpus, plus
# skia-python per-glyph parity and the offline fallback table (M0-7).
"gate:metrics" = { cmd = "python tools/gates/check_metrics.py", depends-on = ["assets:canvaskit"] }

# --- 度量表 (M0-7) --------------------------------------------------------
# 兜底表由同一脚本从受管字体生成；`--check` 重新生成并比对，CI 里由 gate:metrics 调用。
"metrics:table" = "python tools/metrics/build_table.py"
"metrics:check-table" = "python tools/metrics/build_table.py --check"

check = { depends-on = [
  "lint",
  "test",
  "gate:imports",
  "gate:ir-json",
  "gate:determinism",
  "gate:metrics",
] }
