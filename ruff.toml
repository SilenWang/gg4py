line-length = 100
target-version = "py312"
extend-exclude = [".pixi", "node_modules"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# The corpus is real-world text: fullwidth parens, minus signs and emoji are data.
# Comments and docstrings are Simplified Chinese: fullwidth punctuation is correct there.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# spike scripts deliberately mutate sys.path before importing local helpers
"docs/spike/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# gtable 的参数名照抄 R 的 `t` / `l` / `b` / `r`（top/left/bottom/right），
# `l` 在这里就是「左」，不是易混的单字母变量。
"src/ggcore/gtable.py" = ["E741"]
# theme 的 margin() 参数同样是 R 的 t/r/b/l。
"src/ggcore/theme.py" = ["E741"]
# 色板取值表是 tools/refs/palettes_ref.R 生成的：一行一个 palette 的 3..max 全量，
# 换行只会让「重生成零 diff」难比对。
"src/ggcore/palette_data.py" = ["E501"]
# 快照复刻表把每个 case 的 `plot.py` / `meta.toml` **原文**嵌进 triple-quoted 字符串：
# 这些行是磁盘上的字节，截断或重排都会让 `snapshots:import` 不再幂等。
"tools/upstream/import_snapshot_cases.py" = ["E501"]

[format]
# 生成物：`tools/refs/palettes_ref.R` 输出的表要能「重生成零 diff」，格式化器会把
# MappingProxyType 的花括号重排，破坏这条约定。
exclude = ["src/ggcore/palette_data.py"]
