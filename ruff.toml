line-length = 100
target-version = "py312"
extend-exclude = [".pixi", "node_modules"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# The corpus is real-world text: fullwidth parens, minus signs and emoji are data.
# Comments and docstrings are Simplified Chinese: fullwidth punctuation is correct there.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# spike scripts deliberately mutate sys.path before importing local helpers
"docs/spike/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# gtable 的参数名照抄 R 的 `t` / `l` / `b` / `r`（top/left/bottom/right），
# `l` 在这里就是「左」，不是易混的单字母变量。
"src/ggcore/gtable.py" = ["E741"]
# theme 的 margin() 参数同样是 R 的 t/r/b/l。
"src/ggcore/theme.py" = ["E741"]
