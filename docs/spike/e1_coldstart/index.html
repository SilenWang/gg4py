<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E1 · Pyodide 冷启动首图</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #1b1b1f;
        font: 14px/1.45 system-ui, -apple-system, "Noto Sans", sans-serif;
      }
      #wrap {
        padding: 16px;
      }
      canvas {
        display: block;
        border: 1px solid #d8d8dd;
        border-radius: 6px;
        background: #ffffff;
      }
      #status {
        margin-top: 8px;
        color: #666;
        font-variant-numeric: tabular-nums;
        min-height: 1.45em;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="plot" width="960" height="540"></canvas>
      <div id="status">boot</div>
    </div>

    <script type="module">
      // Page side of the E1 cold-start measurement.
      //
      // Timeline: `performance.timeOrigin` is the navigation start, so every
      // `performance.now()` in this document is already "ms since navigation".
      // The worker runs on its own clock; `worker_time_origin` lets us put its
      // stamps on this timeline (see `toPageClock`).
      //
      // The endpoint is the first frame that actually contains the plot: we
      // draw, then wait two animation frames (the first one produces the frame,
      // the second one proves it was composited) and only then read the clock.
      // After that we read the canvas pixels back to confirm the frame is not
      // blank, so a "paint" that never drew anything cannot pass as fast.

      const now = () => performance.now();
      const params = new URLSearchParams(location.search);
      const variant = params.get("variant") || "baseline";
      const canvas = document.getElementById("plot");
      const statusEl = document.getElementById("status");
      const ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: true });

      const marks = { worker_spawn: null, points_received: null, draw_start: null, draw_end: null, paint: null };
      const page_time_origin = performance.timeOrigin;
      const user_agent = navigator.userAgent;

      const status = (text) => {
        statusEl.textContent = text;
      };

      function toPageClock(workerOrigin, ts) {
        // worker ts (ms since worker realm creation) -> ms since navigation
        return workerOrigin + ts - page_time_origin;
      }

      function phasePage(report, key) {
        const p = report.phases[key];
        if (!p) return null;
        return {
          start: toPageClock(report.worker_time_origin, p.start),
          end: toPageClock(report.worker_time_origin, p.end),
          ms: p.end - p.start,
        };
      }

      function drawPlot(xs, ys, report) {
        const W = canvas.width;
        const H = canvas.height;
        const pad = { l: 64, r: 28, t: 92, b: 56 };
        const iw = W - pad.l - pad.r;
        const ih = H - pad.t - pad.b;

        let yMin = Infinity;
        let yMax = -Infinity;
        for (let i = 0; i < ys.length; i++) {
          if (ys[i] < yMin) yMin = ys[i];
          if (ys[i] > yMax) yMax = ys[i];
        }
        const yLo = Math.min(0, Math.floor(yMin * 10) / 10);
        const yHi = Math.max(1, Math.ceil(yMax * 10) / 10);

        const px = (i) => pad.l + (iw * i) / (xs.length - 1);
        const py = (v) => pad.t + ih - ((v - yLo) / (yHi - yLo)) * ih;

        marks.draw_start = now();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        // plot frame + gridlines
        ctx.strokeStyle = "#e6e6ea";
        ctx.lineWidth = 1;
        for (let g = 0; g <= 4; g++) {
          const v = yLo + ((yHi - yLo) * g) / 4;
          const y = Math.round(py(v)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(pad.l, y);
          ctx.lineTo(pad.l + iw, y);
          ctx.stroke();
          ctx.fillStyle = "#6b6b76";
          ctx.font = '12px "Noto Sans", system-ui, sans-serif';
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(v.toFixed(1), pad.l - 10, y);
        }

        // the polyline itself, in the ggplot2-ish blue
        ctx.strokeStyle = "#2c6fb5";
        ctx.lineWidth = 1.4;
        ctx.lineJoin = "round";
        ctx.beginPath();
        for (let i = 0; i < ys.length; i++) {
          const x = px(i);
          const y = py(ys[i]);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // one line of CJK text (system font; a viewer would not ship a 36 MB
        // CJK face to draw a title, so we deliberately do not either)
        ctx.fillStyle = "#1b1b1f";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.font = '600 22px "Noto Sans CJK SC", "Noto Sans", sans-serif';
        const title = "冷启动首图 · 阻尼正弦合成信号";
        ctx.fillText(title, pad.l, 44);

        ctx.fillStyle = "#55555f";
        ctx.font = '14px "Noto Sans CJK SC", "Noto Sans", sans-serif';
        const sub =
          `${report.stats.samples.toLocaleString("en-US")} 个样本 → ` +
          `${report.stats.points.toLocaleString("en-US")} 个顶点 · ` +
          `${report.stats.backend} · CPython ${report.stats.python}`;
        ctx.fillText(sub, pad.l, 70);

        marks.draw_end = now();
        return {
          title_width_px: ctx.measureText(title).width,
          subtitle_width_px: ctx.measureText(sub).width,
        };
      }

      function canvasStats() {
        // Cheap sanity check that the frame has content: fraction of non-white
        // pixels over the whole canvas and over the title's bounding box.
        const pixel = (x, y) => {
          const d = ctx.getImageData(x, y, 1, 1).data;
          return d[0] < 250 || d[1] < 250 || d[2] < 250 ? 1 : 0;
        };
        const all = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let ink = 0;
        for (let i = 0; i < all.length; i += 4) {
          if (all[i] < 250 || all[i + 1] < 250 || all[i + 2] < 250) ink++;
        }
        let titleInk = 0;
        let titleTotal = 0;
        for (let y = 26; y < 48; y += 2) {
          for (let x = 64; x < 520; x += 2) {
            titleInk += pixel(x, y);
            titleTotal++;
          }
        }
        return {
          ink_ratio: ink / (canvas.width * canvas.height),
          title_ink_ratio: titleInk / Math.max(titleTotal, 1),
        };
      }

      function finish(payload) {
        window.__e1Result = payload;
        status.textContent = payload.ok
          ? `first paint ${payload.first_paint_ms.toFixed(0)} ms · ${payload.bytes_label}`
          : `failed: ${payload.error}`;
      }

      status("booting worker");

      const worker = new Worker("./worker.js", { type: "module" });
      marks.worker_spawn = now();
      worker.postMessage({ variant, workload: { samples: 20000, points: 4000 } });

      worker.onerror = (event) => {
        finish({
          ok: false,
          variant,
          page_time_origin,
          marks,
          error: `worker error: ${event.message || "unknown"}`,
        });
      };

      worker.onmessage = (event) => {
        const msg = event.data;
        const report = msg.report || {};
        marks.points_received = now();

        if (msg.type === "error") {
          finish({ ok: false, variant, page_time_origin, marks, error: msg.message, worker_report: report });
          return;
        }

        const payload = msg.payload;
        const points = payload.byteLength / 8;
        const xs = new Float32Array(payload, 0, points);
        const ys = new Float32Array(payload, points * 4, points);
        const text = drawPlot(xs, ys, report);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            marks.paint = now();
            const canvas_stats = canvasStats();
            const paint = marks.paint;
            finish({
              ok: true,
              variant,
              page_time_origin,
              user_agent,
              marks,
              first_paint_ms: paint,
              text_metrics: text,
              canvas: canvas_stats,
              stats: report.stats,
              pyodide_version: report.pyodide_version,
              packages: report.packages,
              worker: {
                worker_time_origin: report.worker_time_origin,
                module_start: report.module_start,
                worker_done: report.worker_done,
                phases: {
                  pyodide_init: phasePage(report, "pyodide_init"),
                  packages_load: phasePage(report, "packages_load"),
                  compute: phasePage(report, "compute"),
                },
                resources: (report.resources || []).map((r) => ({
                  ...r,
                  start: toPageClock(report.worker_time_origin, r.start_time),
                  end: toPageClock(report.worker_time_origin, r.response_end),
                })),
              },
              bytes_label: `${report.stats.points} pts`,
            });
          });
        });
      };

      // The harness may sample navigation timing before the worker is done.
      window.__e1Nav = () => {
        const nav = performance.getEntriesByType("navigation")[0];
        return nav
          ? {
              transfer_size: nav.transferSize,
              encoded_body_size: nav.encodedBodySize,
              decoded_body_size: nav.decodedBodySize,
              response_end: nav.responseEnd,
              dom_content_loaded: nav.domContentLoadedEventEnd,
            }
          : null;
      };
      window.__e1Resources = () =>
        performance.getEntriesByType("resource").map((e) => ({
          name: e.name,
          initiator_type: e.initiatorType,
          start: e.startTime,
          end: e.responseEnd,
          transfer_size: e.transferSize,
          encoded_body_size: e.encodedBodySize,
          decoded_body_size: e.decodedBodySize,
        }));
    </script>
  </body>
</html>
