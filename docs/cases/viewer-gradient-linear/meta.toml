title = "col：线性渐变填充（整层包围盒的 npc 解析）"
source = "svglite:ggplot2 4.0.3 (R 4.5.3, svglite 2.2.2)"
tolerance = { png = 0.02 }
notes = """三根柱子是同一个多行 rectGrob：R 只写一条 `<linearGradient gradientUnits='userSpaceOnUse'>`，
