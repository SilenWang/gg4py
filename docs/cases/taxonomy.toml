# 覆盖矩阵的两条轴（M0-11）。
#
# 行 = 族（geom 族优先，也收 scale / coord / facet / theme / annotation 这类非 geom 族），
# 列 = 特性标签（case 的 meta.toml 里 `features` 用到的值）。
#
# - 新 case 的 `family` / `features` 出现在这里登记过的值上，就落进对应格子；
# - 没登记的值不会让矩阵失败：会自动加行/列，并在 matrix.md 的「未登记的族 / 特性」
#   一节里点名，补登记即可（顺序 = 表格顺序，请按主题追加，不要重排）。
# - 族 × 特性表里的 `—` 表示「该族不使用这个特性」，只是分布信息；**不是**缺口。
# - 真正的缺口（`matrix.md` 的「覆盖缺口」）只数三件事：登记了却没有 case 的族、
#   登记了却没有 case 的特性、以及 `required_combos` 声明必须铺满的组合格。
#   SIL-828 收口后三者都是 0。
# - 新增族 / 特性时把它们写进下面对应分组（不重排已有项）；没 case 的轴不要登记，
#   否则它会变成缺口。

