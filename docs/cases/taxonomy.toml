# 组合矩阵里必须**逐格铺满**的格子（SIL-743 / SIL-828）。`cases:matrix` 会在这里
# 数空格并在「覆盖缺口」里报出来；`tests/test_cases_matrix_combos.py` 读同一份声明，
# 不再各自维护一份坐标列表。
#
# 每个 `[[required_combos]]` 的 `axes` 是若干条轴，每条轴给一组特性标签；组合格 =
# 各轴取一个值的笛卡尔积。一个 case 只要 `features` 同时包含某组合每个轴的一个值，
# 就算覆盖了这一格。多条轴声明的格子互不合并。
[[required_combos]]
name = "分面 × 坐标"
axes = [
  ["facet-wrap", "facet-grid"],
  ["coord-cartesian", "coord-flip", "coord-polar", "coord-trans", "coord-radial"],
]

[[required_combos]]
name = "图例位置 × 排布方向 × 图例个数"
axes = [
  ["legend-pos-right", "legend-pos-left", "legend-pos-top", "legend-pos-bottom"],
  ["guide-direction-vertical", "guide-direction-horizontal"],
  ["legend-single", "legend-double"],
]
